<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hunderterfeld – Zehner & Einer</title>
<style>
:root{--bg:#f4f8fc;--card:#fff;--ink:#17324d;--muted:#64788b;--ten:#4d98df;--tenLight:#dceeff;--one:#3d9b59;--oneLight:#dff5e4;--ok:#35a853;--bad:#d95151;--shadow:0 8px 24px rgba(30,70,100,.11)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#edf6ff,#f9fbfd);color:var(--ink);min-height:100vh}.wrap{max-width:980px;margin:auto;padding:16px}.head,.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow)}.head{padding:17px 21px;display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{margin:0;font-size:clamp(24px,4vw,37px)}.head p{margin:4px 0 0;color:var(--muted);font-size:16px}.legend{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.pill{padding:9px 14px;border-radius:999px;font-weight:800}.ten{background:var(--tenLight);color:#1765a9}.one{background:var(--oneLight);color:#24763b}.card{padding:18px}.answerMode{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 0 16px}.answerMode button{border:2px solid #d7e1e9;border-radius:16px;padding:12px 18px;background:#fff;color:var(--ink);font:inherit;font-weight:850;cursor:pointer;min-height:48px}.answerMode button.active{background:#17324d;color:#fff;border-color:#17324d}.inputArea{display:none;max-width:430px;margin:4px auto 0;text-align:center}.inputArea.show{display:block}.answerInput{width:150px;max-width:60%;font:inherit;font-size:30px;font-weight:900;text-align:center;padding:10px 12px;border:3px solid #c9d8e4;border-radius:15px;color:var(--ink);background:#fff}.checkBtn{border:0;border-radius:14px;padding:12px 18px;margin-left:7px;background:#17324d;color:#fff;font:inherit;font-weight:850;cursor:pointer;min-height:48px}.boardWrap.hidden{display:none}.settings{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}.settings button,.actions button{border:0;border-radius:14px;padding:11px 15px;font:inherit;font-weight:800;cursor:pointer;background:#eef3f7;color:var(--ink);min-height:44px}.settings button.active{outline:3px solid #a8bfd2;background:white}.task{text-align:center;padding:10px 8px 15px}.small{color:var(--muted);font-size:16px}.start{font-size:clamp(22px,4vw,34px);font-weight:850;margin:5px}.instruction{font-size:clamp(27px,5vw,46px);font-weight:900;margin:8px 0}.instruction.tenText{color:var(--ten)}.instruction.oneText{color:var(--one)}.hintline{font-size:17px;font-weight:700;color:var(--muted);min-height:24px}.boardWrap{max-width:650px;margin:0 auto}.board{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;user-select:none}.cell{aspect-ratio:1;border:2px solid #d7e1e9;border-radius:10px;background:#fff;color:#29465f;font-size:clamp(13px,2.6vw,21px);font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s;min-width:0}.cell:hover{transform:translateY(-1px);border-color:#8ba9c1}.cell.startCell{outline:4px solid #34495e;outline-offset:-4px;background:#f0f3f5}.cell.correct{background:#d9f4df!important;border-color:var(--ok);color:#176b2b;transform:scale(1.05)}.cell.wrong{background:#ffe2e2!important;border-color:var(--bad);color:#9c2929}.cell.targetHint{box-shadow:inset 0 0 0 4px #f2c94c}.feedback{text-align:center;min-height:56px;padding:13px 4px 3px;font-size:20px;font-weight:850}.feedback.ok{color:#27823c}.feedback.bad{color:#b23a3a}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:8px}.actions .new{background:#17324d;color:#fff}.actions .help{background:#fff4cc;color:#725b00}.score{text-align:center;color:var(--muted);margin-top:13px;font-weight:700}.explain{margin:14px auto 0;max-width:650px;padding:12px 15px;border-radius:15px;background:#f5f8fa;color:#40596e;display:none;font-size:17px;line-height:1.4}.explain.show{display:block}@media(max-width:560px){.wrap{padding:9px}.head{border-radius:18px;padding:13px 15px}.head p{font-size:14px}.card{border-radius:18px;padding:12px 8px}.board{gap:3px}.cell{border-radius:6px;border-width:1.5px}.legend{margin:9px 0}.pill{padding:7px 10px}.task{padding-top:4px}.instruction{margin:4px 0}.settings button{padding:9px 11px}}

/* iPad: komplette Übung ohne Scrollen sichtbar */
@media (min-width:700px) and (max-height:900px){
  body{min-height:0;overflow:hidden}
  .wrap{max-width:1024px;padding:7px 12px}
  .head{padding:7px 15px;border-radius:16px;min-height:52px}
  .head h1{font-size:25px;line-height:1.05}
  .head p{font-size:13px;margin-top:2px}
  .head>div:last-child{font-size:29px!important}
  .legend{position:absolute;top:13px;left:50%;transform:translateX(-50%);margin:0;gap:6px}
  .pill{padding:5px 10px;font-size:13px}
  .card{margin-top:7px;padding:7px 12px 8px;border-radius:18px}
  .answerMode{margin:0 0 5px;gap:6px}
  .answerMode button{padding:6px 13px;min-height:34px;border-radius:11px;font-size:14px}
  .settings{margin-bottom:4px;gap:6px}
  .settings button,.actions button{padding:5px 11px;min-height:33px;border-radius:10px;font-size:14px}
  .settings button.active{outline-width:2px}
  .task{padding:1px 4px 3px}
  .small{font-size:12px;line-height:1}
  .start{font-size:23px;margin:1px}
  .instruction{font-size:29px;line-height:1;margin:1px 0 2px}
  .hintline{font-size:13px;min-height:16px;line-height:1.15}
  .boardWrap{max-width:370px}
  .board{gap:2px}
  .cell{border-width:1px;border-radius:5px;font-size:13px}
  .cell.startCell{outline-width:3px;outline-offset:-3px}
  .feedback{min-height:27px;padding:4px 2px 0;font-size:15px;line-height:1.15}
  .actions{margin-top:3px;gap:6px}
  .score{margin-top:4px;font-size:12px;line-height:1}
  .explain{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:8px;width:min(620px,90%);margin:0;padding:8px 12px;font-size:14px;line-height:1.25;box-shadow:0 5px 18px rgba(30,70,100,.18)}
  .inputArea{margin:4px auto 2px}
  .answerInput{font-size:25px;padding:6px 10px}
  .checkBtn{padding:7px 15px;min-height:38px}
}
@media (min-width:700px) and (max-height:760px){
  .head{min-height:46px;padding:5px 14px}.head h1{font-size:22px}.head p{font-size:12px}
  .legend{top:10px}.pill{padding:4px 9px}
  .card{margin-top:5px;padding-top:5px}
  .answerMode{margin-bottom:3px}.settings{margin-bottom:2px}
  .answerMode button,.settings button,.actions button{min-height:30px;padding-top:4px;padding-bottom:4px}
  .start{font-size:20px}.instruction{font-size:25px}.hintline{font-size:12px;min-height:14px}
  .boardWrap{max-width:335px}.cell{font-size:12px}
  .feedback{min-height:23px;font-size:14px;padding-top:2px}.actions{margin-top:2px}.score{margin-top:3px}
}
</style></head>
<body><div class="wrap">
<div class="head"><div><h1>Was verändert sich?</h1><p>Zehner und Einer im Hunderterfeld</p></div><div style="font-size:40px">💯</div></div>
<div class="legend"><span class="pill ten">Zehner = blau</span><span class="pill one">Einer = grün</span></div>
<div class="card">
<div class="answerMode" aria-label="Antwortart"><button data-answer="input">⌨️ Eintippen</button><button data-answer="board" class="active">💯 Hunderterfeld</button></div>
<div class="settings" aria-label="Aufgabenauswahl"><button data-mode="mix" class="active">Gemischt</button><button data-mode="ten">Zehner</button><button data-mode="one">Einer</button><button data-mode="plus">Nur +</button><button data-mode="minus">Nur −</button></div>
<div class="task"><div class="small">Ausgangszahl</div><div id="startText" class="start">34</div><div id="instruction" class="instruction tenText">+ 2 Zehner</div><div id="hintline" class="hintline">Tippe die neue Zahl im Hunderterfeld an.</div></div>
<div id="inputArea" class="inputArea"><input id="answerInput" class="answerInput" type="number" min="1" max="100" inputmode="numeric" aria-label="Ergebnis"><button id="check" class="checkBtn">Prüfen</button></div>
<div id="boardWrap" class="boardWrap"><div id="board" class="board" aria-label="Hunderterfeld"></div></div>
<div id="feedback" class="feedback" aria-live="polite"></div>
<div class="actions"><button id="help" class="help">💡 Tipp</button><button id="new" class="new">Neue Aufgabe</button></div>
<div id="explain" class="explain"></div><div id="score" class="score">Richtig: 0 · Aufgaben: 0</div>
</div></div>
<script>
(()=>{const root=document;const board=root.getElementById('board'),boardWrap=root.getElementById('boardWrap'),inputArea=root.getElementById('inputArea'),answerInput=root.getElementById('answerInput'),hintline=root.getElementById('hintline'),startText=root.getElementById('startText'),instruction=root.getElementById('instruction'),feedback=root.getElementById('feedback'),explain=root.getElementById('explain'),score=root.getElementById('score');let mode='mix',answerMode='board',start=34,target=54,kind='ten',sign=1,amount=2,locked=false,right=0,total=0;
for(let n=1;n<=100;n++){const b=document.createElement('button');b.type='button';b.className='cell';b.textContent=n;b.dataset.n=n;b.setAttribute('aria-label','Zahl '+n);b.addEventListener('click',()=>{if(answerMode==='board')choose(n,b)});board.appendChild(b)}
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function clear(){board.querySelectorAll('.cell').forEach(c=>c.classList.remove('startCell','correct','wrong','targetHint'));feedback.textContent='';feedback.className='feedback';explain.className='explain';explain.textContent='';answerInput.value='';locked=false}
function make(){clear();let tries=0;do{tries++;kind=mode==='ten'?'ten':mode==='one'?'one':Math.random()<.52?'ten':'one';sign=mode==='plus'?1:mode==='minus'?-1:(Math.random()<.5?1:-1);amount=kind==='ten'?rnd(1,4):rnd(1,9);start=rnd(1,100);target=start+sign*(kind==='ten'?amount*10:amount)}while((target<1||target>100||target===start)&&tries<500);startText.textContent=start;instruction.textContent=(sign>0?'+ ':'− ')+amount+' '+(kind==='ten'?'Zehner':'Einer');instruction.className='instruction '+(kind==='ten'?'tenText':'oneText');board.children[start-1].classList.add('startCell');if(answerMode==='input')setTimeout(()=>answerInput.focus(),0)}
function finish(n,cell){if(locked)return;total++;if(n===target){right++;locked=true;if(cell)cell.classList.add('correct');feedback.textContent='✓ Richtig! '+start+(sign>0?' + ':' − ')+(kind==='ten'?amount*10:amount)+' = '+target;feedback.className='feedback ok'}else{if(cell){cell.classList.add('wrong');setTimeout(()=>cell.classList.remove('wrong'),650)}feedback.textContent=kind==='ten'?'Noch nicht. Achte auf die Zehner.':'Noch nicht. Achte auf die Einer.';feedback.className='feedback bad'}score.textContent='Richtig: '+right+' · Aufgaben: '+total}
function choose(n,cell){finish(n,cell)}
function checkInput(){if(locked)return;const raw=answerInput.value.trim();if(raw===''){feedback.textContent='Trage zuerst eine Zahl ein.';feedback.className='feedback bad';return}const n=Number(raw);if(!Number.isInteger(n)||n<1||n>100){feedback.textContent='Bitte eine Zahl von 1 bis 100 eingeben.';feedback.className='feedback bad';return}finish(n,null);if(!locked){answerInput.select()}}
function setAnswerMode(next){answerMode=next;root.querySelectorAll('.answerMode button').forEach(b=>b.classList.toggle('active',b.dataset.answer===next));const input=next==='input';inputArea.classList.toggle('show',input);boardWrap.classList.toggle('hidden',input);hintline.textContent=input?'Tippe das Ergebnis ein.':'Tippe die neue Zahl im Hunderterfeld an.';make()}
root.querySelectorAll('.answerMode button').forEach(b=>b.addEventListener('click',()=>setAnswerMode(b.dataset.answer)));root.getElementById('check').addEventListener('click',checkInput);answerInput.addEventListener('keydown',e=>{if(e.key==='Enter')checkInput()});
root.getElementById('help').addEventListener('click',()=>{const dir=sign>0?'dazu':'weg';explain.innerHTML=kind==='ten'?'<b>Zehner sind blau:</b> '+amount+' Zehner '+dir+' bedeutet <b>'+(sign>0?'+':'−')+(amount*10)+'</b>. '+(answerMode==='board'?'Im Hunderterfeld gehst du pro Zehner eine Reihe '+(sign>0?'nach unten':'nach oben')+'.':'Die Einerstelle bleibt gleich.'):'<b>Einer sind grün:</b> '+amount+' Einer '+dir+' bedeutet <b>'+(sign>0?'+':'−')+amount+'</b>. '+(answerMode==='board'?'Gehe Feld für Feld '+(sign>0?'weiter':'zurück')+'.':'Achte besonders auf die Einerstelle.');explain.className='explain show'});root.getElementById('new').addEventListener('click',make);root.querySelectorAll('.settings button').forEach(b=>b.addEventListener('click',()=>{root.querySelectorAll('.settings button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;make()}));make();})();
</script></body></html>
