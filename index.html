<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hunderterfeld – Zehner & Einer</title>
<style>
:root{--bg:#f4f8fc;--card:#fff;--ink:#17324d;--muted:#64788b;--ten:#4d98df;--tenLight:#dceeff;--one:#3d9b59;--oneLight:#dff5e4;--ok:#35a853;--bad:#d95151;--shadow:0 8px 24px rgba(30,70,100,.11)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#edf6ff,#f9fbfd);color:var(--ink);min-height:100vh}.wrap{max-width:980px;margin:auto;padding:16px}.head,.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow)}.head{padding:17px 21px;display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{margin:0;font-size:clamp(24px,4vw,37px)}.head p{margin:4px 0 0;color:var(--muted);font-size:16px}.legend{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.pill{padding:9px 14px;border-radius:999px;font-weight:800}.ten{background:var(--tenLight);color:#1765a9}.one{background:var(--oneLight);color:#24763b}.card{padding:18px}.settings{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}.settings button,.actions button{border:0;border-radius:14px;padding:11px 15px;font:inherit;font-weight:800;cursor:pointer;background:#eef3f7;color:var(--ink);min-height:44px}.settings button.active{outline:3px solid #a8bfd2;background:white}.task{text-align:center;padding:10px 8px 15px}.small{color:var(--muted);font-size:16px}.start{font-size:clamp(22px,4vw,34px);font-weight:850;margin:5px}.instruction{font-size:clamp(27px,5vw,46px);font-weight:900;margin:8px 0}.instruction.tenText{color:var(--ten)}.instruction.oneText{color:var(--one)}.hintline{font-size:17px;font-weight:700;color:var(--muted);min-height:24px}.boardWrap{max-width:650px;margin:0 auto}.board{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;user-select:none}.cell{aspect-ratio:1;border:2px solid #d7e1e9;border-radius:10px;background:#fff;color:#29465f;font-size:clamp(13px,2.6vw,21px);font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s;min-width:0}.cell:hover{transform:translateY(-1px);border-color:#8ba9c1}.cell.startCell{outline:4px solid #34495e;outline-offset:-4px;background:#f0f3f5}.cell.correct{background:#d9f4df!important;border-color:var(--ok);color:#176b2b;transform:scale(1.05)}.cell.wrong{background:#ffe2e2!important;border-color:var(--bad);color:#9c2929}.cell.targetHint{box-shadow:inset 0 0 0 4px #f2c94c}.feedback{text-align:center;min-height:56px;padding:13px 4px 3px;font-size:20px;font-weight:850}.feedback.ok{color:#27823c}.feedback.bad{color:#b23a3a}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:8px}.actions .new{background:#17324d;color:#fff}.actions .help{background:#fff4cc;color:#725b00}.score{text-align:center;color:var(--muted);margin-top:13px;font-weight:700}.explain{margin:14px auto 0;max-width:650px;padding:12px 15px;border-radius:15px;background:#f5f8fa;color:#40596e;display:none;font-size:17px;line-height:1.4}.explain.show{display:block}@media(max-width:560px){.wrap{padding:9px}.head{border-radius:18px;padding:13px 15px}.head p{font-size:14px}.card{border-radius:18px;padding:12px 8px}.board{gap:3px}.cell{border-radius:6px;border-width:1.5px}.legend{margin:9px 0}.pill{padding:7px 10px}.task{padding-top:4px}.instruction{margin:4px 0}.settings button{padding:9px 11px}}
</style></head>
<body><div class="wrap">
<div class="head"><div><h1>Was verändert sich?</h1><p>Zehner und Einer im Hunderterfeld</p></div><div style="font-size:40px">💯</div></div>
<div class="legend"><span class="pill ten">Zehner = blau</span><span class="pill one">Einer = grün</span></div>
<div class="card">
<div class="settings" aria-label="Aufgabenauswahl"><button data-mode="mix" class="active">Gemischt</button><button data-mode="ten">Zehner</button><button data-mode="one">Einer</button><button data-mode="plus">Nur +</button><button data-mode="minus">Nur −</button></div>
<div class="task"><div class="small">Ausgangszahl</div><div id="startText" class="start">34</div><div id="instruction" class="instruction tenText">+ 2 Zehner</div><div class="hintline">Tippe die neue Zahl im Hunderterfeld an.</div></div>
<div class="boardWrap"><div id="board" class="board" aria-label="Hunderterfeld"></div></div>
<div id="feedback" class="feedback" aria-live="polite"></div>
<div class="actions"><button id="help" class="help">💡 Tipp</button><button id="new" class="new">Neue Aufgabe</button></div>
<div id="explain" class="explain"></div><div id="score" class="score">Richtig: 0 · Aufgaben: 0</div>
</div></div>
<script>
(()=>{const root=document;const board=root.getElementById('board'),startText=root.getElementById('startText'),instruction=root.getElementById('instruction'),feedback=root.getElementById('feedback'),explain=root.getElementById('explain'),score=root.getElementById('score');let mode='mix',start=34,target=54,kind='ten',sign=1,amount=2,locked=false,right=0,total=0;
for(let n=1;n<=100;n++){const b=document.createElement('button');b.type='button';b.className='cell';b.textContent=n;b.dataset.n=n;b.setAttribute('aria-label','Zahl '+n);b.addEventListener('click',()=>choose(n,b));board.appendChild(b)}
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function clear(){board.querySelectorAll('.cell').forEach(c=>c.classList.remove('startCell','correct','wrong','targetHint'));feedback.textContent='';feedback.className='feedback';explain.className='explain';explain.textContent='';locked=false}
function make(){clear();let tries=0;do{tries++;kind=mode==='ten'?'ten':mode==='one'?'one':Math.random()<.52?'ten':'one';sign=mode==='plus'?1:mode==='minus'?-1:(Math.random()<.5?1:-1);amount=kind==='ten'?rnd(1,4):rnd(1,9);start=rnd(1,100);target=start+sign*(kind==='ten'?amount*10:amount)}while((target<1||target>100||target===start)&&tries<500);startText.textContent=start;instruction.textContent=(sign>0?'+ ':'− ')+amount+' '+(kind==='ten'?(amount===1?'Zehner':'Zehner'):(amount===1?'Einer':'Einer'));instruction.className='instruction '+(kind==='ten'?'tenText':'oneText');board.children[start-1].classList.add('startCell');}
function choose(n,cell){if(locked)return;total++;if(n===target){right++;locked=true;cell.classList.add('correct');feedback.textContent='✓ Richtig! '+start+(sign>0?' + ':' − ')+(kind==='ten'?amount*10:amount)+' = '+target;feedback.className='feedback ok'}else{cell.classList.add('wrong');feedback.textContent=kind==='ten'?'Noch nicht. Denke in Zehnersprüngen nach '+(sign>0?'unten':'oben')+'.':'Noch nicht. Gehe '+amount+' Feld'+(amount===1?'':'er')+' '+(sign>0?'weiter':'zurück')+'.';feedback.className='feedback bad';setTimeout(()=>cell.classList.remove('wrong'),650)}score.textContent='Richtig: '+right+' · Aufgaben: '+total}
root.getElementById('help').addEventListener('click',()=>{const dir=sign>0?'dazu':'weg';explain.innerHTML=kind==='ten'?'<b>Zehner sind blau:</b> '+amount+' Zehner '+dir+' bedeutet <b>'+(sign>0?'+':'−')+(amount*10)+'</b>. Im Hunderterfeld gehst du pro Zehner eine Reihe '+(sign>0?'nach unten':'nach oben')+'.':'<b>Einer sind grün:</b> '+amount+' Einer '+dir+' bedeutet <b>'+(sign>0?'+':'−')+amount+'</b>. Gehe Feld für Feld '+(sign>0?'weiter':'zurück')+'.';explain.className='explain show'});root.getElementById('new').addEventListener('click',make);root.querySelectorAll('.settings button').forEach(b=>b.addEventListener('click',()=>{root.querySelectorAll('.settings button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;make()}));make();})();
</script></body></html>
